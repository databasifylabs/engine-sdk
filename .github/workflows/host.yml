name: host

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: host-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/databasifylabs/engine-sdk

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    env:
      ARCH: ${{ matrix.platform.arch }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches the SDK version
        run: |
          sdk=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' sdk.go)
          if [ "v$sdk" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match sdk.Version $sdk"
            exit 1
          fi

      - name: Create a buildx builder
        run: docker buildx create --name databasify --driver docker-container --use

      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Refuse to publish a version twice
        run: |
          if docker buildx imagetools inspect "$IMAGE:${GITHUB_REF_NAME#v}" > /dev/null 2>&1; then
            echo "$IMAGE:${GITHUB_REF_NAME#v} is already published; the app pins this tag, so release a new version instead"
            exit 1
          fi

      - name: Push by digest
        run: |
          docker buildx build --platform "linux/$ARCH" --file images/host/Dockerfile \
            --build-arg "SDK_VERSION=${GITHUB_REF_NAME#v}" \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file metadata.json .
          mkdir digests
          jq -er '."containerimage.digest"' metadata.json > "digests/$ARCH"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.platform.arch }}
          path: digests/
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          merge-multiple: true
          path: digests

      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Tag the multi-arch image
        run: |
          docker buildx imagetools create --tag "$IMAGE:${GITHUB_REF_NAME#v}" \
            "$IMAGE@$(cat digests/amd64)" "$IMAGE@$(cat digests/arm64)"
